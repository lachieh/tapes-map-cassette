[project]
name = "tapes-map-cassette"
version = "0.0.0"
description = "Tapes cassette serving 3-D coordinates for every session, placed by meaning."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "scikit-learn>=1.9.1",
    "umap-learn>=0.6.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs Docker to start a throwaway pgvector Postgres"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
